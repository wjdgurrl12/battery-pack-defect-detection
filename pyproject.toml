[project]
name = "battery-pack-defect-detection"
version = "0.1.0"
description = "FastAPI + Streamlit + Kafka + Postgres 개발 환경"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "confluent-kafka>=2.6",
    "fastapi>=0.141.1",
    "pandas>=3.0.5",
    "psycopg[binary,pool]>=3.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "streamlit>=1.61.1",
    "uvicorn>=0.52.1",
]

[project.scripts]
battery-pack-defect-detection = "battery_pack_defect_detection:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
