# 개발 환경 뼈대: dev 컨테이너 + 앱 서비스(api, streamlit) + 미들웨어(postgres, kafka)
# 앱 코드는 이미지에 굽지 않고 ./ 를 /workspace 로 마운트해서 쓴다.
# 그래서 호스트에서 파일을 고치면 컨테이너에 그대로 반영된다.

# image 는 Docker Hub 에 올라간 태그, build 는 그 이미지를 만드는 방법이다.
# 팀원은 pull 로 받고(pull_policy: missing), 의존성을 바꾼 사람만 build 후 push 한다.
# 의존성/Dockerfile 이 바뀌면 태그 버전을 올려서 다시 push 해야 한다 (0.1.0 -> 0.1.1).
x-app: &app
  image: 4dcookie/vibration-monitoring-dev:0.1.0
  build: .
  pull_policy: missing
  volumes:
    - .:/workspace
  working_dir: /workspace

x-app-env: &app-env
  # src 레이아웃이라 패키지는 /workspace/src 밑에 있는데, 파이썬은 CWD(/workspace)만
  # 경로에 넣는다. 이미지에는 의존성만 굽고 프로젝트는 설치하지 않으므로(--no-install-project)
  # editable 설치가 만들어 주는 .pth 도 없다. 그 자리를 이 한 줄이 대신한다.
  # (이게 없으면 세 컨테이너 모두 `import battery_pack_defect_detection` 이 실패한다)
  PYTHONPATH: /workspace/src
  DATABASE_URL: postgresql://app:app@postgres:5432/appdb
  KAFKA_BROKER: broker:19092

services:
  # 개발 작업을 하는 컨테이너. VS Code Dev Containers 가 여기에 붙는다.
  dev:
    <<: *app
    command: sleep infinity
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy

  api:
    <<: *app
    # --reload: 코드를 고치면 자동으로 다시 뜬다
    command: uvicorn main:app --host 0.0.0.0 --port 3000 --reload
    ports:
      - "3000:3000"
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  streamlit:
    <<: *app
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      PYTHONPATH: /workspace/src
      API_BASE_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    volumes:
      # 초기 스키마가 필요해지면 db/init 에 *.sql 을 넣는다 (최초 기동 시 1회 실행)
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  broker:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:19092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8080:8080"
    depends_on:
      broker:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:19092
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  pgdata: