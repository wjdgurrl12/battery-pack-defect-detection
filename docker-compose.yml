# 개발 환경 뼈대: dev 컨테이너 + 앱 서비스(api, streamlit) + 미들웨어(postgres, kafka)
# 앱 코드는 이미지에 굽지 않고 ./ 를 /workspace 로 마운트해서 쓴다.
# 그래서 호스트에서 파일을 고치면 컨테이너에 그대로 반영된다.

# image 는 Docker Hub 에 올라간 태그, build 는 그 이미지를 만드는 방법이다.
# 팀원은 pull 로 받고(pull_policy: missing), Dockerfile 이 바뀌면 태그 버전을 올려서
# 다시 build + push 한다 (0.1.0 -> 0.1.1).
#
# 반면 의존성(uv add)만 바뀐 경우는 이미지를 다시 굽지 않아도 된다. 아래 서비스들이
# 뜰 때마다 `uv sync --locked` 로 자기 /opt/venv 를 uv.lock 에 맞추기 때문이다.
# uv.lock 은 git 으로 전파되므로, 받는 쪽은 git pull 후 up -d 만 하면 된다.
x-app: &app
  image: 4dcookie/vibration-monitoring-dev:0.1.0
  build: .
  pull_policy: missing
  volumes:
    - .:/workspace
    # uv 캐시를 컨테이너 밖에 둬서 기동할 때마다 다시 받지 않게 한다
    - uv-cache:/root/.cache/uv
  working_dir: /workspace

# 아래 command 들 앞에 붙는 `uv sync --locked --no-install-project` 가 그 동기화다.
# 변경이 없으면 1초도 걸리지 않고, 늘어난 패키지가 있으면 그것만 받는다.
# --no-install-project 는 Dockerfile 과 같은 이유다(프로젝트는 PYTHONPATH 로 잡는다).
# 뒤에 exec 를 붙이는 이유: 실행할 프로세스가 PID 1 을 물려받아 종료 시그널을 직접
# 받게 하기 위함이다. sh 가 PID 1 로 남으면 시그널을 삼켜서 stop 이 매번 강제 종료된다.

x-app-env: &app-env
  # src 레이아웃이라 패키지는 /workspace/src 밑에 있는데, 파이썬은 CWD(/workspace)만
  # 경로에 넣는다. 이미지에는 의존성만 굽고 프로젝트는 설치하지 않으므로(--no-install-project)
  # editable 설치가 만들어 주는 .pth 도 없다. 그 자리를 이 한 줄이 대신한다.
  # (이게 없으면 세 컨테이너 모두 `import battery_pack_defect_detection` 이 실패한다)
  PYTHONPATH: /workspace/src
  DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/appdb
  KAFKA_BROKER: broker:19092

services:
  # 개발 작업을 하는 컨테이너. VS Code Dev Containers 가 여기에 붙는다.
  dev:
    <<: *app
    command: sh -c "uv sync --locked --no-install-project && exec sleep infinity"
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy

  api:
    <<: *app
    # --reload: 코드를 고치면 자동으로 다시 뜬다
    command: sh -c "uv sync --locked --no-install-project && exec uvicorn main:app --host 0.0.0.0 --port 3000 --reload"
    ports:
      - "3000:3000"
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  streamlit:
    <<: *app
    command: sh -c "uv sync --locked --no-install-project && exec streamlit run app.py --server.port=8501 --server.address=0.0.0.0"
    ports:
      - "8501:8501"
    environment:
      PYTHONPATH: /workspace/src
      # 화면은 Kafka 두 토픽(측정/판정)만 구독한다. DB 직결은 3단계에서 제거했다.
      KAFKA_BROKER: broker:19092
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    volumes:
      # 초기 스키마가 필요해지면 db/init 에 *.sql 을 넣는다 (최초 기동 시 1회 실행)
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  broker:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:19092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8080:8080"
    depends_on:
      broker:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:19092
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  pgdata:
  uv-cache: