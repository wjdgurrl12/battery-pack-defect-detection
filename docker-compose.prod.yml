# 배포/시연용. **clone 없이 이미지만으로 도는 판**이다.
#
#   docker compose -f docker-compose.prod.yml up -d
#   http://localhost:8501 -> 오른쪽 위 '재생'
#
# 개발용 docker-compose.yml 과 다른 점은 셋이다.
#   1. 마운트가 없다. 코드와 모델은 이미지 안에 있다(Dockerfile 의 runtime).
#   2. `uv sync` 로 시작하지 않는다. 의존성이 이미 이미지에 고정돼 있다.
#   3. Postgres 에 데모 9팩이 미리 들어 있다(Dockerfile 의 postgres-demo).
#      적재 단계가 없으므로 up 한 번이면 재생할 준비가 끝난다.
#
# 프로젝트 이름을 따로 준다. 개발 스택과 컨테이너·볼륨이 섞이지 않게 하려는
# 것이다. 다만 **포트는 같으므로 둘을 동시에 띄울 수는 없다** - 개발 스택이
# 떠 있다면 `docker compose down` 을 먼저 한다.
name: battery-pack-demo

x-app: &app
  image: 4dcookie/battery-pack-app:0.1.0
  build:
    context: .
    target: runtime
  pull_policy: missing
  restart: unless-stopped

x-app-env: &app-env
  PYTHONPATH: /app/src
  DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/appdb
  KAFKA_BROKER: broker:19092
  # 개발 쪽과 같은 이유로 여기서도 못 박는다 - 모델 교체는 눈에 보이는
  # 행위여야 한다. 경로가 /workspace 가 아니라 /app 인 것만 다르다.
  BD_ANOMALY_MODEL: /app/models/battery_anomaly.pkl

services:
  api:
    <<: *app
    # --reload 가 없다. 코드가 이미지에 고정돼 있어 감시할 대상이 없고,
    # 리로더가 파일을 훑는 만큼만 손해다.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      - "3000:3000"
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  streamlit:
    <<: *app
    command: ["streamlit", "run", "app.py",
              "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      PYTHONPATH: /app/src
      KAFKA_BROKER: broker:19092
      # 화면의 재생·정지·초기화 버튼이 부르는 곳. 코드 기본값과 같지만,
      # 이 판에서 화면이 api 에 닿지 못하면 버튼이 통째로 사라지므로
      # (render_controls 의 '조작할 수 없습니다') 여기서 못 박아 둔다.
      API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 20

  postgres:
    image: 4dcookie/battery-pack-postgres-demo:0.1.0
    build:
      context: .
      target: postgres-demo
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    volumes:
      # db/init 을 마운트하지 않는다. 스키마와 데모 덤프가 이미지 안에 들어
      # 있고(/docker-entrypoint-initdb.d), 마운트를 걸면 그것을 덮어써서
      # 데이터가 없는 빈 DB 로 뜬다.
      - pgdata-demo:/var/lib/postgresql/data
    healthcheck:
      # 적재가 끝나야 healthy 다. 테이블을 세는 것으로 확인한다 - pg_isready
      # 만 보면 초기화 스크립트가 도는 중에도 통과해서, api 가 빈 DB 를 보고
      # 먼저 뜬다.
      test: ["CMD-SHELL", "psql -U app -d appdb -tAc 'SELECT count(*) > 0 FROM pack_measurement' | grep -q t"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  broker:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:19092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # 시연 중에 토픽을 열어 볼 일이 있어 함께 둔다. 없어도 파이프라인은 돈다:
  #   docker compose -f docker-compose.prod.yml up -d api streamlit
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      broker:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:19092
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  pgdata-demo:
